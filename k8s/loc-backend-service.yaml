apiVersion: v1
kind: Service
metadata:
  name: loc-backend
  namespace: loc
spec:
  # Phase 7 — was NodePort (exposed directly on every node's IP at :30500).
  # Confirmed the real traffic path is the Cloudflare tunnel ->
  # nginx-ingress-controller (cloudflared-config.yaml) -> this Service's
  # ClusterIP via loc-ingress.yaml -> pod, which never touches the NodePort
  # at all. ClusterIP removes the unintended direct-to-node bypass of
  # Cloudflare/the ingress controller without changing that traffic path.
  type: ClusterIP

  selector:
    app: loc-backend

  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000